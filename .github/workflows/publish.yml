name: Publish JavaScript API to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'get-air/video' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Verify release metadata and tag
        run: npm run check:release -- --tag "$GITHUB_REF_NAME"
      - name: Reject prerelease version from stable workflow
        run: |
          package_version=$(node --print "require('./package.json').version")
          case "$package_version" in
            *-*) echo "Prerelease versions must use a non-latest npm release workflow"; exit 1 ;;
          esac
      - run: npm run ci
      - run: npm ci
        working-directory: examples/air-framework-app
      - run: npm run build
        working-directory: examples/air-framework-app
      - name: Publish to npm
        run: npm publish --access public --provenance
