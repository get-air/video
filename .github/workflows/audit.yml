name: Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit.yml
      - package.json
      - package-lock.json
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit.yml
      - package.json
      - package-lock.json
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
