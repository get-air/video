name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release metadata consistency
        run: npm run check:release
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run --ignore-scripts
      - name: Reject platform coupling in browser artifacts
        run: |
          if grep -R -E "@tauri-apps|__TAURI__|plugin:video" dist-js; then
            echo "Browser package contains a Tauri dependency"
            exit 1
          fi
      - name: Smoke-test packed ESM entrypoints
        run: |
          package_tarball=$(npm pack --silent --ignore-scripts)
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install "$GITHUB_WORKSPACE/$package_tarball" >/dev/null
          node --input-type=module -e "await import('@get-air/video'); await import('@get-air/video/effect'); await import('@get-air/video/canvas')"
      - run: npm ci
        working-directory: examples/air-framework-app
      - run: npm run build
        working-directory: examples/air-framework-app
